module_name: UAVCAN
parameters:
- group: UAVCAN
  definitions:
    UAVCAN_ESC_IFACE:
      description:
        short: Which CAN interfaces to output ESC messages on.
        long: |
          Since ESC messages are high priority and sent at a high rate, it is
          recommended to only enable the interfaces that are actually used.
          Otherwise, the ESC messages will arbitrate lower priority messages and
          starve other nodes on the bus.
      type: bitmask
      bit:
        0: CAN1
        1: CAN2
        2: CAN3
        3: CAN4
        4: CAN5
        5: CAN6
        6: CAN7
        7: CAN8
      default: 255
      min: 1
      max: 255
      reboot_required: true

- group: THACO Actuator
  definitions:
    THACO_ACTUATOR:
      description:
        short: THACO actuator enable mask
        long: |
          Enable THACO actuator slots A1 through A8.
          Bit 0 corresponds to A1 and bit 7 corresponds to A8.
      type: bitmask
      bit:
        0: Actuator A1
        1: Actuator A2
        2: Actuator A3
        3: Actuator A4
        4: Actuator A5
        5: Actuator A6
        6: Actuator A7
        7: Actuator A8
      default: 0
      min: 0
      max: 255

    THACO_ID_A${i}:
      description:
        short: THACO actuator ${i} ID
        long: |
          Logical actuator ID assigned to THACO actuator slot A${i}.
      type: enum
      values:
        0: None
        1: Gripper 1
        2: Gripper 2
        3: Gripper 3
        4: Gripper 4
        5: Pump 1
        6: Pump 2
        7: Pump 3
        8: Pump 4
        9: Servo 1
        10: Servo 2
        11: Servo 3
        12: Servo 4
      num_instances: 8
      instance_start: 1
      default: 0

    THACO_RC_A${i}:
      description:
        short: THACO actuator ${i} RC channel
        long: |
          RC channel assigned to THACO actuator slot A${i}.
          Set to 0 to disable RC control for this slot.
      type: int32
      min: 0
      max: 18
      num_instances: 8
      instance_start: 1
      default: 0

    UAVCAN_ESC_TYPE:
      description:
        short: ESC protocol type for UAVCAN output.
        long: |
          Selects which DroneCAN ESC protocol to use.
          0 = Standard UAVCAN ESC (uavcan.equipment.esc.RawCommand).
          1 = HobbyWing ESC (com.hobbywing.esc.RawCommand). Requires
          ESCs to have unique node IDs and throttle channels assigned
          via the SetID service before use. Reboot required.
      type: enum
      values:
        0: Standard UAVCAN ESC
        1: HobbyWing ESC
      default: 0
      reboot_required: true

actuator_output:
  show_subgroups_if: 'UAVCAN_ENABLE>=3'
  config_parameters:
    - param: 'UAVCAN_ENABLE'
      label: 'Configure'
      function: 'enable'
    - param: 'UAVCAN_BITRATE'
      label: 'Bitrate'
  output_groups:
    - param_prefix: UAVCAN_EC
      group_label: 'ESCs'
      channel_label: 'ESC'
      standard_params:
        min: { min: 0, max: 8191, default: 1 }
        max: { min: 0, max: 8191, default: 8191 }
        failsafe: { min: 0, max: 8191 }
      num_channels: 8
    - param_prefix: UAVCAN_SV
      group_label: 'Servos'
      channel_label: 'Servo'
      standard_params:
        disarmed: { min: 0, max: 1000, default: 500 }
        min: { min: 0, max: 1000, default: 0 }
        max: { min: 0, max: 1000, default: 1000 }
        failsafe: { min: 0, max: 1000 }
      num_channels: 8
